[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "npcc"
version = "0.1.0"
description = "Neural Pair-Copulas Constructions (NPCCs) for multivariate conditional density estimation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyvinecopulib>=0.8.0",
  "tabpfn>=8.0",
  "torch>=2.5",
]

[project.optional-dependencies]
cpu = ["torch>=2.5"]
cu126 = ["torch>=2.5"]
cu128 = ["torch>=2.5"]
cu130 = ["torch>=2.5"]
cu132 = ["torch>=2.5"]
# Simulation-study package (npcc.experiments) and the npcc-simstudy CLI.
experiments = ["pandas>=2.0", "matplotlib>=3.7", "pyarrow>=15.0,<24.0"]
# Optional non-TabPFN inner backends (mirrors ScoringBench's
# requirements_models.txt).  Each is selected via
# RosenblattBicop(backend=...).
gbm = ["scikit-learn>=1.3"]
ngboost = ["ngboost>=0.5.0"]
tabicl = ["tabicl>=2.0"]
catboost = ["catboost>=1.2"]
xgboost = ["xgboost>=2.0"]
pytabkit = ["pytabkit>=1.5"]
# Synthefy Nori. Pinned to the tvatter fork (see [tool.uv.sources]) until the
# torch-uncapping fix lands on upstream PyPI; then this becomes a plain pin.
nori = ["synthefy-nori>=0.12"]
# Umbrella of every non-TabPFN backend, installable alongside a CUDA flavour,
# e.g. `uv sync --extra cu130 --extra backends`.
backends = [
  "scikit-learn>=1.3",
  "ngboost>=0.5.0",
  "tabicl>=2.0",
  "catboost>=1.2",
  "xgboost>=2.0",
  "pytabkit>=1.5",
  "synthefy-nori>=0.12",
]

[project.scripts]
npcc-simstudy = "npcc.experiments.cli:main"

[dependency-groups]
dev = [
  # Linters and formatters
  "ruff>=0.9",
  "ty>=0.0.14",
  # Unit testing
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pytest-xdist>=3.0.0",
  # For loading TABPFN_TOKEN from .env in the integration test
  "python-dotenv>=1.0",
]
interactive = [
  # For data wrangling
  "pandas>=2.0",
  # For notebooks
  "marimo>=0.10",
  "notebook>=7.0.0",
  "ipykernel>=6.25.0",
  "ipywidgets>=8.1.0",
  # Visualization
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "plotnine",
  # Tables
  "great-tables>=0.18.0",
  "tabulate>=0.9.0",
]

[tool.uv]
default-groups = ["dev", "interactive"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
    { extra = "cu132" },
  ],
]

[tool.uv.sources]
# Pin the tested head of pyvinecopulib PR #326.
pyvinecopulib = { git = "https://github.com/vinecopulib/pyvinecopulib.git", rev = "4b6eb8fcc47f6eb04761466d79ccaf6b2caed3db" }
# Temporary: install Synthefy Nori from the fork branch that uncaps torch
# (PR https://github.com/Synthefy/synthefy-nori/pull/79). Drop once on PyPI.
synthefy-nori = { git = "https://github.com/tvatter/synthefy-nori.git", branch = "allow-newer-torch-cuda" }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu130", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 80
target-version = "py311"
indent-width = 2
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
# Marimo cell functions have a reactive-graph signature style that makes
# ANN annotations on cell arguments extremely verbose and unidiomatic.
"notebooks/**" = ["ANN"]

# Type checking with ty
[tool.ty.environment]
python = ".venv"
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]
